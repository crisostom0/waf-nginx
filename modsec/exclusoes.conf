# Exceções locais, carregadas antes das regras do CRS.
# O instalador não sobrescreve este arquivo depois de criado.
#
# As rotas abaixo ficam em modo só-detecção: o WAF registra no log de
# auditoria o que teria bloqueado, mas deixa passar. O caminho é
# decodificado e normalizado antes da comparação, então
# /api/auth/../admin não cai aqui.
#
# O ideal é trocar isto por exclusões pontuais das regras que dão falso
# positivo, depois de ver no log quais são, por exemplo:
#   SecRule REQUEST_FILENAME "@streq /api/auth/login" \
#       "id:10100,phase:1,pass,nolog,ctl:ruleRemoveTargetById=942100;ARGS:senha"

SecRule REQUEST_FILENAME "@rx ^/api/(?:auth|config)(?:/|$)" \
    "id:10000,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,ctl:ruleEngine=DetectionOnly"

SecRule REQUEST_FILENAME "@beginsWith /api/info/" \
    "id:10001,phase:1,pass,nolog,t:none,t:urlDecodeUni,t:normalizePath,ctl:ruleEngine=DetectionOnly"
