# HTTPS do WAF. Emita o certificado (veja o README), descomente e troque
# exemplo.com.br pelo seu domínio. Aplique com:
#   nginx -t && systemctl reload nginx
# O instalador não sobrescreve este arquivo depois de criado.

# listen 443 ssl default_server;
# listen [::]:443 ssl default_server;
# ssl_certificate     /etc/letsencrypt/live/exemplo.com.br/fullchain.pem;
# ssl_certificate_key /etc/letsencrypt/live/exemplo.com.br/privkey.pem;
# ssl_protocols TLSv1.2 TLSv1.3;
