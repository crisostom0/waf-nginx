# WAF: Nginx + ModSecurity + OWASP CRS, liberando só o Brasil e redes privadas
# e bloqueando datacenters.
# Instalado em /etc/nginx/conf.d/waf.conf (contexto http).

# 1 para IPs de redes privadas ou do Brasil, 0 para o resto.
# geo-pais.conf é gerado por /usr/local/sbin/waf-atualiza-geo.
geo $waf_permitido {
    default 0;
    include /etc/nginx/waf/redes-privadas.conf;
    include /etc/nginx/waf/geo-pais.conf;
}

# 1 para IPs de nuvens e datacenters (provedores em asn-datacenters.txt).
# geo-datacenters.conf também é gerado por waf-atualiza-geo.
geo $waf_datacenter {
    default 0;
    include /etc/nginx/waf/geo-datacenters.conf;
}

# 1 se a origem deve ser bloqueada: fora do Brasil/redes privadas ou datacenter.
map "$waf_permitido:$waf_datacenter" $waf_bloqueado {
    default 1;
    "1:0"   0;
}

# Endereço da aplicação protegida (upstream waf_backend).
include /etc/nginx/waf/backend.conf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Sem server_name: o nginx.conf do Rocky já tem um servidor "_" e o
    # nome repetido gera aviso. default_server já pega qualquer domínio.
    server_tokens off;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # Mantenha igual a SecRequestBodyLimit em modsecurity.conf.
    client_max_body_size 500m;

    # Validação de certificado do Let's Encrypt. Os servidores de validação
    # ficam fora do Brasil, então esta rota não passa pelo bloqueio por
    # origem; ela só serve os arquivos de /var/www/acme.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        if ($waf_bloqueado) {
            return 403;
        }
        proxy_pass http://waf_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # O WAF é a borda: não repassa um X-Forwarded-For vindo do cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Porta 443 e certificado (desativado até você configurar).
    include /etc/nginx/waf/https.conf;
}
